<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HomeSync Lights</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07111f;color:#e8f1fa;font-family:Inter,system-ui,sans-serif}.app{width:min(760px,92vw);padding:32px;border:1px solid #ffffff14;border-radius:28px;background:#0b1625;box-shadow:0 24px 80px #0008}.top{display:flex;justify-content:space-between;align-items:center}.eyebrow{color:#38bdf8;font-size:12px;font-weight:800;letter-spacing:.14em}.score{padding:10px 14px;border-radius:12px;background:#10263a}.room{margin:26px 0;display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.light{height:110px;border:1px solid #ffffff12;border-radius:18px;background:#0f2032;cursor:pointer;transition:.2s;display:grid;place-items:center;font-size:32px}.light.on{background:#173c58;box-shadow:0 0 30px #38bdf855;border-color:#38bdf855}.light:hover{transform:translateY(-3px)}button{border:0;border-radius:13px;padding:12px 18px;background:#38bdf8;color:#06111c;font-weight:800;cursor:pointer}.hint{color:#8fa9bf}.win{color:#67e8f9;font-weight:700;min-height:24px}@media(max-width:600px){.room{grid-template-columns:repeat(3,1fr)}}
</style></head><body><main class="app"><div class="top"><div><div class="eyebrow">HOMESYNC MINI GAME</div><h1>Light Up the Room</h1></div><div class="score">Moves: <b id="moves">0</b></div></div><p class="hint">Turn on every light. Clicking a light also toggles its neighbours.</p><div id="room" class="room"></div><div class="win" id="win"></div><button onclick="reset()">New game</button></main>
<script>
const room=document.getElementById('room'),movesEl=document.getElementById('moves'),win=document.getElementById('win');let a=[],moves=0;function reset(){moves=0;movesEl.textContent=0;win.textContent='';a=Array.from({length:15},()=>Math.random()>.5);render()}function toggle(i){[i,i-1,i+1].forEach(j=>{if(j>=0&&j<15&&Math.floor(j/5)===Math.floor(i/5))a[j]=!a[j]});moves++;movesEl.textContent=moves;render();if(a.every(Boolean))win.textContent='✨ Room fully lit — you win!'}function render(){room.innerHTML='';a.forEach((on,i)=>{const b=document.createElement('button');b.className='light '+(on?'on':'');b.innerHTML=on?'💡':'○';b.onclick=()=>toggle(i);room.appendChild(b)})}reset();
</script></body></html>
